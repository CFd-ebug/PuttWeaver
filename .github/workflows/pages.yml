name: Build, test, deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      # the page itself: download it from a pull request's run to try a change on a phone
      - uses: actions/upload-artifact@v4
        with:
          name: putt-lab-${{ github.sha }}
          path: dist/index.html
          if-no-files-found: error
          retention-days: 14
      - name: Collect the site (only index.html is published, never test.html)
        if: github.event_name != 'pull_request'
        run: mkdir site && cp dist/index.html site/index.html && touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
